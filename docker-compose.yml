version: '3.8'

services:
  # ============================================================
  # PostgreSQL (База данных)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: rkt-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-rkt_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: rkt_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backups:/backups
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - rkt_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rkt_admin} -d rkt_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Next.js (Фронтенд + Бэкенд)
  # ============================================================
  nextjs:
    build:
      context: ./apps
      dockerfile: Dockerfile
    container_name: rkt-nextjs
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-rkt_admin}:${DB_PASSWORD}@postgres:5432/rkt_hub
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      
      # AI Providers
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY}
      SALUTESPEECH_API_KEY: ${SALUTESPEECH_API_KEY}
      YANDEXGPT_IAM_TOKEN: ${YANDEXGPT_IAM_TOKEN}
      YANDEXGPT_FOLDER_ID: ${YANDEXGPT_FOLDER_ID}
      
      # Telegram
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_CHAT_ID: ${TG_CHAT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rkt_network
    expose:
      - "3000"

  # ============================================================
  # n8n (Автоматизация)
  # ============================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: rkt-n8n
    restart: always
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      N8N_HOST: ${DOMAIN:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN:-localhost}/n8n/
      GENERIC_TIMEZONE: Europe/Moscow
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${DB_USER:-rkt_admin}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      DB_POSTGRESDB_DATABASE: rkt_hub
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rkt_network
    expose:
      - "5678"

  # ============================================================
  # Nginx (Reverse Proxy + HTTPS)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: rkt-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - nextjs
      - n8n
    networks:
      - rkt_network

networks:
  rkt_network:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
